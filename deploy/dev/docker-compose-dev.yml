services:
    app:
        build:
            context: ../..
            dockerfile: deploy/dev/Dockerfile
        image: acopio-api:dev
        container_name: acopio-api-dev
        restart: unless-stopped
        env_file:
            - .env
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - default
            - dokploy-network
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

networks:
    dokploy-network:
        external: true
