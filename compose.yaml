services:
    acopio-api-local:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: sail-8.4/app
        container_name: acopio-api-local
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-8080}:80"
        env_file:
            - .env
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
            - "./deploy/local/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro"
            - "./deploy/local/99-sail.ini:/etc/php/8.4/cli/conf.d/99-sail.ini:ro"
        networks:
            - dokploy-network
networks:
    dokploy-network:
        external: true
